    <rect x="3060" y="96" width="448" height="448" fill="#fff9c4" opacity="0.4"/>
    <rect x="3132" y="168" width="304" height="304" fill="#fff176"/>
    <rect x="3180" y="216" width="208" height="208" fill="#fffde7"/>
  </g>

  <!-- 像素方块云 -->

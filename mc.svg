  <!-- 标题（双层描边 + 硬阴影，方块感） -->
  <text x="1932" y="442" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="230" font-weight="900" fill="#303030" text-anchor="middle">MC 从零到无穷</text>
  <text x="1920" y="430" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="230" font-weight="900" fill="#ffffff" stroke="#303030" stroke-width="10" paint-order="stroke" text-anchor="middle">MC 从零到无穷</text>
  <text x="1926" y="566" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="100" font-weight="700" fill="#303030" opacity="0.55" text-anchor="middle">从安装游戏到模组开发</text>
  <text x="1920" y="560" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="100" font-weight="700" fill="#ffffff" opacity="0.95" text-anchor="middle">从安装游戏到模组开发</text>
</svg>
